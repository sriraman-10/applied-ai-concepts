services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: procedural
      POSTGRES_PASSWORD: procedural_dev
      POSTGRES_DB: procedural_memory
    ports:
      - "5433:5432"
    volumes:
      - procedural-postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procedural -d procedural_memory"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  procedural-postgres-data:

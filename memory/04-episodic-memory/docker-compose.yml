services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: episodic
      POSTGRES_PASSWORD: episodic_dev
      POSTGRES_DB: episodic_memory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episodic -d episodic_memory"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - episodic_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

volumes:
  episodic_postgres_data:
